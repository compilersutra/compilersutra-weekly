id: llvm
name: LLVM / Clang
org: LLVM Project
category: llvm
project: llvm
kind: git
enabled: true
url: https://github.com/llvm/llvm-project.git
github_repo: llvm/llvm-project
default_branch: main
mirror_dirname: llvm-project
path_excludes:
- mlir/
path_labels:
  clang/: Clang
  clang-tools-extra/: Clang Tools
  lld/: LLD
  lldb/: LLDB
  llvm/: LLVM
max_commits: 800
notes: Full monorepo. MLIR filtered via mlir.yaml on the same mirror.
