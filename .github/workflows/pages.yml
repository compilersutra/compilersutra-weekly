name: Pages
on:
  push:
    branches: [master, main]
    paths:
      - "reports/**"
      - "site/**"
      - "src/csweekly/**"
      - "pyproject.toml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Rebuild site
        env:
          # Optional: Cloudflare Web Analytics token (repo secret).
          CSWEEKLY_CF_BEACON_TOKEN: ${{ secrets.CSWEEKLY_CF_BEACON_TOKEN }}
        run: csweekly index --reports-dir reports --site-dir site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
